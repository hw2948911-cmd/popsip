<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
// ===== 可调参数（只改这里就够了）=====
const CFG={
  dur:90,              // 总时长（60 判定 + 30 隐藏关）
  baseTime:60,         // 判定时间点
  missAllowed:5,       // 前 60 秒最多漏几个
  cupW:68, cupH:86,    // 杯子尺寸
  cupSpeed:1500,       // 杯子最大移速（防刷屏）
  catchBandDiv:4,      // 纵向判定 = 杯高 / 这个数
  catchW:0.40, catchR:0.35, // 横向判定
  gapMin:0.30, gapBase:1.10, gapLv:0.045, gapTime:0.010, // 出球间隔
  hiddenGapMin:0.42, hiddenGapMul:1.0,                  // 隐藏关间隔
  rushBase:1, rushTime:0.011, rushStart:6, rushMax:1.95, // 加速曲线
  hiddenRush:1.30,                                      // 隐藏关加速倍率
  vBase:90, vLv:12, vRand:34, vCap:400, vCapHidden:560, // 下落速度
  pairChance:0.22, doubleAfter:40, doubleChance:0.30,   // 镜像/双发
  comboStep:10, comboBonus:5,                           // 连击奖励
  pts:{fest:5,pudding:5,white:2,pearl:1},
  rad:{fest:19,pudding:14,white:11,pearl:11}
};
// ==================================
const PINK='#E0006B',RED='#D62828',DUR=CFG.dur;

const ZALO_URL='https://zalo.me/g/ozu0yzjsdpgmctvtnmwy';  // 官方 Zalo 群
const SITE='https://hw2948911-cmd.github.io/popsip/';
const QS=new URLSearchParams(location.search);
const CH_SCORE=parseInt(QS.get('ch')||'',10);      // 好友挑战分数
const CH_NAME=(QS.get('n')||'').slice(0,12);       // 好友名字
const REF=(QS.get('r')||'').slice(0,12);           // 邀请人
const INAPP=/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|MicroMessenger|Line\/|Twitter/i.test(navigator.userAgent);
let W=0,H=0,cupX=0,cupY=0;
const cupW=CFG.cupW,cupH=CFG.cupH;
let cw=cupW;                 // 当前杯口宽度（隐藏关变窄）

let state='start',score=0,level=1,pearls=[],spawnT=0,shake=0,playerName='',time=0,spawnCount=0;
let hidden=false,misses=0,bannerT=0,bursts=[],combo=0,maxCombo=0,pairUsed=false;
const BASE_TIME=CFG.baseTime;   // 前 60 秒的判定时间点
const MISS_ALLOWED=CFG.missAllowed; // 前 60 秒最多能漏几个（改 0 就是零失误）
// 固定掉落顺序：每个循环 10 个（6 黑 / 3 白 / 1 布丁），分数可比、比赛公平
// 掉落顺序：20 个一循环，按时间解锁高分糖
function kindAt(n,t){
  if(t>=BASE_TIME) return FEST[n%FEST.length];
  const i=n%20;
  if(i===0||i===10) return 'pudding';
  if(i%4===0) return 'white';
  return 'pearl';
}

function resize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth||window.innerWidth;
  H=cv.clientHeight||window.innerHeight;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  cupY=H-cupH-52;
  if(!cupX)cupX=W/2;
}

function reset(){
  score=0;level=1;pearls=[];spawnT=0;shake=0;time=0;spawnCount=0;hidden=false;misses=0;bannerT=0;combo=0;pairUsed=false;cw=cupW;
  cupX=W/2;cupY=H-cupH-52;cupTarget=cupX;cupTarget=cupX;
  // 开局先铺 3 颗：位置随机、彼此拉开
  const usedX=[];
  for(let i=0;i<3;i++){
    let x=40+Math.random()*(W-80), tries=0;
    while(tries<12 && usedX.some(function(u){return Math.abs(u-x)<W*0.22;})){
      x=40+Math.random()*(W-80); tries++;
    }
    usedX.push(x);
    const kind=kindAt(spawnCount++,0);
    pearls.push({x:x,y:H*(0.20+i*0.13)+(Math.random()*34-17),r:kind==='pudding'?14:11,
      kind:kind,pts:kind==='pudding'?5:(kind==='white'?2:1),v:145});
  }
}

function spawnPearl(){
  const gapY=Math.max(70,150-Math.max(0,time-30)*2.2);
  const top=pearls.reduce((m,p)=>Math.min(m,p.y),9999);
  if(top<gapY)return false;
  const kind=kindAt(spawnCount,time);
  spawnCount++;
  let pts=1,rad=11;
  if(FEST.indexOf(kind)>=0){pts=CFG.pts.fest;rad=CFG.rad.fest;}
  else if(kind==='pudding'){pts=CFG.pts.pudding;rad=CFG.rad.pudding;}
  else if(kind==='white'){pts=CFG.pts.white;rad=CFG.rad.white;}
  const rush=Math.min(CFG.rushMax,CFG.rushBase+Math.max(0,time-CFG.rushStart)*CFG.rushTime)*(hidden?CFG.hiddenRush:1);
let px;
  if(hidden&&pearls.length){
    // 交替掉到另一侧：强制杯子横向移动，不能原地横扫
    const lastX=pearls[pearls.length-1].x;
    px = (lastX<W/2)
      ? W*0.55+Math.random()*W*0.33
      : W*0.12+Math.random()*W*0.33;
  }else{
    px = 26+Math.random()*(W-52);
  }
  px = Math.max(26, Math.min(W-26, px));
  pearls.push({x:px,y:-24,r:rad,kind:kind,pts:pts,
    v:Math.min(hidden?CFG.vCapHidden:CFG.vCap,(CFG.vBase+level*CFG.vLv+Math.random()*CFG.vRand)*rush)});
  return true;
}

function update(dt){
  if(state!=='play')return;
  time+=dt;
  if(bannerT>0)bannerT=Math.max(0,bannerT-dt);
  if(time>=BASE_TIME&&!hidden){
    if(misses>MISS_ALLOWED){gameOver();return;}
    hidden=true;bannerT=2.8;cw=56;sfxJingle();
  }
  if(time>=DUR){gameOver();return;}
  level=Math.max(level,Math.min(16,1+Math.floor(score/10)));
  let gap=Math.max(CFG.gapMin,CFG.gapBase-level*CFG.gapLv-Math.max(0,time-6)*CFG.gapTime);
  if(hidden)gap=Math.max(CFG.hiddenGapMin,gap*CFG.hiddenGapMul);   // 数量更少，靠距离和选择
  // 杯子限速，防止左右刷屏作弊
  const cupMaxV=CFG.cupSpeed;
  const dxc=cupTarget-cupX;
  const step=cupMaxV*dt;
  cupX += Math.abs(dxc)<=step ? dxc : (dxc>0?step:-step);
  for(let bi=bursts.length-1;bi>=0;bi--){ bursts[bi].t+=dt; if(bursts[bi].t>0.5)bursts.splice(bi,1); }
  spawnT-=dt;
  if(spawnT<=0){
    if(spawnPearl()){
      spawnT=gap;
      if(!hidden&&time>CFG.doubleAfter&&Math.random()<CFG.doubleChance)spawnPearl();
      if(hidden&&!pairUsed&&time>=DUR-7&&pearls.length){
        // 只出现一次的同高度镜像：最后 7 秒的终极考验
        pairUsed=true;
        const last=pearls[pearls.length-1];
        const k2=kindAt(spawnCount++,time);
        pearls.push({x:Math.max(34,Math.min(W-34,W-last.x)),y:-24,r:19,kind:k2,pts:5,v:last.v});
      }
    }else{
      spawnT=0.08;
    }
  }
  for(let i=pearls.length-1;i>=0;i--){
    const p=pearls[i];
    p.y+=p.v*dt;
    const inZone=p.y+p.r>cupY&&p.y-p.r<cupY+cupH/CFG.catchBandDiv;

    if(inZone&&Math.abs(p.x-cupX)<cw*CFG.catchW+p.r*CFG.catchR){
      score+=p.pts;shake=9;combo++;if(combo>maxCombo)maxCombo=combo;sfxCatch();
      if(hidden){
        if(typeof confetti==='function') confetti({
          particleCount: 6, spread: 52, startVelocity: 18, gravity: 0.9, ticks: 45,
          scalar: 0.75, shapes: ['star'], zIndex: 5,
          colors: ['#FFE400','#FFBD00','#E89400','#FFCA6C','#FDFFB8'],
          origin: { x: Math.max(0.03,Math.min(0.97,p.x/W)), y: Math.max(0.05,Math.min(0.95,cupY/H)) },
          disableForReducedMotion: true
        });
      }else{
        waterSplash(p.x, cupY);
      }
      bursts.push({x:p.x,y:cupY,t:0,pts:p.pts,kind:p.kind});
      if(combo%CFG.comboStep===0){ score+=CFG.comboBonus; shake=14; sfxCombo(); bursts.push({x:W/2,y:cupY-60,t:0,pts:5,bonus:true}); }
      pearls.splice(i,1);
      continue;
    }
    if(p.y-p.r>H){
      pearls.splice(i,1);shake=5;
      if(!hidden){score=Math.max(0,score-2);misses++;}
      combo=0;   // 60 秒后漏接不扣分
    }
  }
  if(shake>0)shake=Math.max(0,shake-dt*45);
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#EA2A78');
  g.addColorStop(.55,'#CE0A5E');
  g.addColorStop(1,'#8E0B3C');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const tt=performance.now()/1000;
  for(let i=0;i<50;i++){
    const sp=10+(i%5)*7;
    const x=(i*137)%(W||1);
    const y=((i*79+tt*sp)%(H+60))-30;
    const r=1.4+(i%3)*1.1;
    ctx.globalAlpha=.55+(i%4)*0.12;
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function cupPath(){
  const t=cw/2,b=cw*0.36;
  ctx.beginPath();ctx.moveTo(-t,0);ctx.lineTo(-b,cupH);
  ctx.quadraticCurveTo(0,cupH+12,b,cupH);ctx.lineTo(t,0);ctx.closePath();
}
function drawBursts(){
  for(let i=0;i<bursts.length;i++){
    const b=bursts[i], k=b.t/0.5;
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-k);
    if(!hidden){
      // 前 60 秒兜底：库没加载时手绘白色水花
      if(typeof confetti==='function'){ ctx.restore(); continue; }
      ctx.fillStyle='#fff';
      for(let j=0;j<5;j++){
        const a=-Math.PI/2+(j-2)*0.42;
        const d=8+k*30;
        ctx.beginPath();
        ctx.arc(b.x+Math.cos(a)*d, b.y+Math.sin(a)*d+k*10, 2.6*(1-k)+1, 0, 7);
        ctx.fill();
      }
    }else if(typeof confetti!=='function'){
      // 隐藏关兜底：库没加载时用手绘金色五角星
      ctx.fillStyle='#FFD34D';
      for(let j=0;j<5;j++){
        const a=-Math.PI/2+(j-2)*0.42;
        const d=8+k*30;
        const sx=b.x+Math.cos(a)*d, sy=b.y+Math.sin(a)*d+k*10;
        const rr=(3.4*(1-k)+1.2)*1.6;
        ctx.beginPath();
        for(let v=0;v<5;v++){
          const ang=-Math.PI/2+v*Math.PI*2/5, ang2=ang+Math.PI/5;
          ctx.lineTo(sx+Math.cos(ang)*rr, sy+Math.sin(ang)*rr);
          ctx.lineTo(sx+Math.cos(ang2)*rr*0.45, sy+Math.sin(ang2)*rr*0.45);
        }
        ctx.closePath();ctx.fill();
      }
    }

    // 飘分
    ctx.fillStyle='#FFE9A8';
    ctx.font='800 '+Math.round(16+4*(1-k))+'px -apple-system,Roboto,sans-serif';
    ctx.textAlign='center';
    if(b.bonus){
      ctx.font='900 '+Math.round(24+8*(1-k))+'px -apple-system,Roboto,sans-serif';
      ctx.fillStyle='#FFD34D';
      ctx.fillText('COMBO +'+b.pts, b.x, b.y-20-k*40);
    }else{
      ctx.font='800 '+Math.round(16+4*(1-k))+'px -apple-system,Roboto,sans-serif';
      ctx.fillStyle='#FFE9A8';
      ctx.fillText('+'+b.pts, b.x, b.y-14-k*34);
    }
    ctx.restore();
  }
}
function drawCup(){
  ctx.save();
  ctx.translate(cupX+(Math.random()-0.5)*shake,cupY);
  if(hidden){ drawSantaSack(); ctx.restore(); return; }
  const t=cw/2;
  const p=cupPath;
  p();ctx.fillStyle='#FFFDF9';ctx.fill();
  p();ctx.strokeStyle=PINK;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,t,6,0,0,7);
  ctx.fillStyle='#FFFDF9';ctx.fill();ctx.stroke();
  ctx.fillStyle=PINK;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='italic bold '+Math.round(cw*0.225)+'px Georgia,serif';
  ctx.fillText('PopSip',0,cupH*0.46);
  ctx.restore();
}

/* 隐藏关：圣诞袜接珍珠（尺寸/开口见下） */

}

function drawCandy(p){
  const r=p.r;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-0.45);
  const w=r*1.1,h=r*2.35,rr=w/2;
  ctx.beginPath();
  ctx.moveTo(-rr,-h/2+rr);
  ctx.arc(0,-h/2+rr,rr,Math.PI,0);
  ctx.lineTo(rr,h/2-rr);
  ctx.arc(0,h/2-rr,rr,0,Math.PI);
  ctx.closePath();
  ctx.fillStyle='#FFFDF9';ctx.fill();
  ctx.save();ctx.clip();
  ctx.fillStyle='#E23B3B';
  for(let y=-h;y<h+r;y+=r*0.78){
    ctx.beginPath();
    ctx.moveTo(-w,y);ctx.lineTo(w,y-r*0.55);
    ctx.lineTo(w,y-r*0.55+r*0.34);ctx.lineTo(-w,y+r*0.34);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

function drawGift(p){
  const w=p.r*2.2,h=p.r*1.9,x=p.x-w/2,y=p.y-h/2;
  roundRect(ctx,x,y+h*0.2,w,h*0.8,4);ctx.fillStyle='#E23B3B';ctx.fill();
  roundRect(ctx,x-2,y,w+4,h*0.32,4);ctx.fillStyle='#C92727';ctx.fill();
  ctx.fillStyle='#FFD34D';
  ctx.fillRect(p.x-w*0.09,y,w*0.18,h);
  ctx.fillRect(x,y+h*0.54,w,h*0.13);
  ctx.beginPath();
  ctx.arc(p.x-w*0.2,y-1,w*0.17,0,7);
  ctx.arc(p.x+w*0.2,y-1,w*0.17,0,7);
  ctx.fill();
}

function festCane(){
  const r=52, t=r*0.23;
  const cx=r*0.42, cy=-r*0.28, R=r*0.42;
  const pts=[];
  for(let y=r*1.02;y>=cy;y-=r*0.03) pts.push([0,y]);
  for(let a=Math.PI;a>=0;a-=0.07) pts.push([cx+Math.cos(a)*R, cy+Math.sin(a)*R]);
  for(let k=1;k<=6;k++) pts.push([cx+R+k*r*0.055, cy+k*r*0.028]);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=t*2;ctx.strokeStyle='#FFFBF5';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
  ctx.fillStyle='#E23B3B';
  let acc=r*0.18;
  for(let i=1;i<pts.length;i++){
    const dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1];
    acc+=Math.hypot(dx,dy);
    if(acc>=r*0.34){
      acc=0;
      const ang=Math.atan2(dy,dx);
      ctx.save();ctx.translate(pts[i][0],pts[i][1]);ctx.rotate(ang);
      ctx.fillRect(-r*0.10,-t,r*0.20,t*2);
      ctx.restore();
    }
  }
}
function festGift(){
  const r=52,w=r*1.7,h=r*1.2,y=-r*0.10;
  // body
  roundRect(ctx,-w/2,y,w,h,4);ctx.fillStyle='#E03A3A';ctx.fill();
  // lid
  roundRect(ctx,-w/2-4,y-h*0.42,w+8,h*0.46,4);ctx.fillStyle='#C42B2B';ctx.fill();
  // gold ribbon
  ctx.fillStyle='#FFD34D';
  ctx.fillRect(-w*0.08,y-h*0.44,w*0.16,h*1.02);
  ctx.fillRect(-w/2,y+h*0.28,w,h*0.12);
  // bow
  ctx.fillStyle='#FFC93C';
  for(const s of [-1,1]){
    ctx.beginPath();
    ctx.ellipse(s*w*0.20,y-h*0.48,w*0.20,h*0.15,s*0.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle='#F2B21E';
  ctx.beginPath();ctx.arc(0,y-h*0.48,w*0.09,0,Math.PI*2);ctx.fill();
}
function festTree(){
  const r=52;
  // trunk
  ctx.fillStyle='#7A4A22';
  roundRect(ctx,-r*0.13,r*0.52,r*0.26,r*0.42,2);ctx.fill();
  const L=[[0.86,-0.58,'#2E9954'],[1.16,-0.02,'#26884A'],[1.46,0.54,'#1E7A40']];
  for(const [hw,cy,col] of L){
    const w=hw*r, top=cy*r-r*0.62, bot=cy*r+r*0.42;
    ctx.beginPath();
    ctx.moveTo(0,top);ctx.lineTo(w,bot);ctx.lineTo(-w,bot);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
  }
  // ornaments inside tree
  const dots=[[0,-0.30,'#FFD34D'],[-0.42,0.10,'#E23B3B'],[0.40,0.05,'#4FA3E3'],
              [-0.70,0.52,'#4FA3E3'],[0.10,0.40,'#FFD34D'],[0.72,0.52,'#E23B3B']];
  for(const [x,y,col] of dots){
    ctx.beginPath();ctx.arc(x*r,y*r,r*0.13,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
  }
  // star
  ctx.fillStyle='#FFD34D';
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rad=(i%2?0.10:0.22)*r;
    ctx[i?'lineTo':'moveTo'](Math.cos(a)*rad, -r*0.68+Math.sin(a)*rad);
  }
  ctx.closePath();ctx.fill();
}
function festSock(){
  const r=52;
  ctx.fillStyle='#C62F2F';
  roundRect(ctx,-r*0.42,-r*0.62,r*0.62,r*1.12,10);ctx.fill();   // 袜筒
  roundRect(ctx,-r*0.42, r*0.16,r*1.32,r*0.54,26);ctx.fill();   // 脚掌
  ctx.fillStyle='#A32424';
  ctx.beginPath();ctx.ellipse(-r*0.14,r*0.40,r*0.30,r*0.26,0,0,Math.PI*2);ctx.fill();  // 脚跟
  ctx.beginPath();ctx.ellipse( r*0.72,r*0.42,r*0.24,r*0.26,0,0,Math.PI*2);ctx.fill();  // 脚尖
  ctx.fillStyle='#F7FAFF';
  roundRect(ctx,-r*0.52,-r*0.90,r*0.80,r*0.34,8);ctx.fill();    // 白毛边
  ctx.fillStyle='rgba(255,255,255,.92)';
  [[-0.10,-0.30],[0.02,0.05],[-0.42,0.55],[0.30,0.62],[0.54,0.30]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(x*r,y*r,r*0.07,0,Math.PI*2);ctx.fill();
  });
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=r*0.05;
  ctx.beginPath();
  ctx.moveTo(-r*0.05-r*0.11,-r*0.14);ctx.lineTo(-r*0.05+r*0.11,-r*0.14);
  ctx.moveTo(-r*0.05,-r*0.14-r*0.11);ctx.lineTo(-r*0.05,-r*0.14+r*0.11);
  ctx.moveTo(-r*0.05-r*0.08,-r*0.14-r*0.08);ctx.lineTo(-r*0.05+r*0.08,-r*0.14+r*0.08);
  ctx.moveTo(-r*0.05-r*0.08,-r*0.14+r*0.08);ctx.lineTo(-r*0.05+r*0.08,-r*0.14-r*0.08);
  ctx.stroke();
}
function festGinger(){
  const r=52;
  ctx.fillStyle='#C8813F';
  // head
  ctx.beginPath();ctx.arc(0,-r*0.60,r*0.34,0,Math.PI*2);ctx.fill();
  // body
  roundRect(ctx,-r*0.26,-r*0.28,r*0.52,r*0.62,6);ctx.fill();
  // arms
  roundRect(ctx,-r*0.78,-r*0.26,r*0.54,r*0.22,9);ctx.fill();
  roundRect(ctx, r*0.24,-r*0.26,r*0.54,r*0.22,9);ctx.fill();
  // legs
  roundRect(ctx,-r*0.28,r*0.30,r*0.24,r*0.46,9);ctx.fill();
  roundRect(ctx, r*0.04,r*0.30,r*0.24,r*0.46,9);ctx.fill();
  // icing on arms/legs
  ctx.fillStyle='#FBFDFF';
  roundRect(ctx,-r*0.80,-r*0.28,r*0.16,r*0.26,5);ctx.fill();
  roundRect(ctx, r*0.64,-r*0.28,r*0.16,r*0.26,5);ctx.fill();
  roundRect(ctx,-r*0.30,r*0.62,r*0.28,r*0.14,5);ctx.fill();
  roundRect(ctx, r*0.02,r*0.62,r*0.28,r*0.14,5);ctx.fill();
  // face
  ctx.fillStyle='#3B2415';
  ctx.beginPath();ctx.arc(-r*0.12,-r*0.66,r*0.05,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( r*0.12,-r*0.66,r*0.05,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3B2415';ctx.lineWidth=r*0.055;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,-r*0.56,r*0.13,0.4,Math.PI-0.4);ctx.stroke();
  // buttons
  ctx.fillStyle='#2E8B3F';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,-r*0.14+i*r*0.18,r*0.055,0,Math.PI*2);ctx.fill();}
}
function drawFest(p){
  ctx.save();ctx.translate(p.x,p.y);
  var k=p.r*2.3;
  ctx.save();ctx.scale(k/104,k/104);
  if(p.kind==='candy')festCane();
  else if(p.kind==='gift')festGift();
  else if(p.kind==='tree')festTree();
  else if(p.kind==='sock')festSock();
  else festGinger();
  ctx.restore();
  ctx.restore();
}

function drawPearl(p){
  if(FEST.indexOf(p.kind)>=0){
    if(SPR[p.kind]){ const sz=p.r*2.35; ctx.drawImage(SPR[p.kind],p.x-sz/2,p.y-sz/2,sz,sz); }
    else drawFest(p);
    return;
  }
  if(p.kind==='candy'){drawCandy(p);return;}
  if(p.kind==='gift'){drawGift(p);return;}
  if(p.kind==='pudding'){
const w=p.r*2.05,h=p.r*1.02;                  // 矮一点、宽一点，像焦糖布丁
    ctx.beginPath();
    ctx.moveTo(p.x-w/2,p.y-h/2);
    ctx.lineTo(p.x+w/2,p.y-h/2);
    ctx.lineTo(p.x+w*0.34,p.y+h/2);
    ctx.quadraticCurveTo(p.x,p.y+h/2+5,p.x-w*0.34,p.y+h/2);
    ctx.closePath();
    const g2=ctx.createLinearGradient(0,p.y-h/2,0,p.y+h/2);
    g2.addColorStop(0,'#FFE9B0');g2.addColorStop(1,'#EFB43F');
    ctx.fillStyle=g2;ctx.fill();
    // 焦糖顶面
    ctx.beginPath();ctx.ellipse(p.x,p.y-h/2,w/2,w*0.15,0,0,7);
    ctx.fillStyle='#A9581B';ctx.fill();
    // 高光
    ctx.beginPath();ctx.ellipse(p.x-w*0.16,p.y+h*0.06,w*0.10,h*0.20,0,0,7);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
    return;
  }
  const g=ctx.createRadialGradient(p.x-3,p.y-4,1,p.x,p.y,p.r);
  if(p.kind==='white'){
    g.addColorStop(0,'rgba(255,255,255,.98)');
    g.addColorStop(1,'rgba(230,242,255,.8)');
  }else{
    g.addColorStop(0,'#6B4226');g.addColorStop(1,'#2A1608');
  }
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(p.x-p.r*0.32,p.y-p.r*0.35,p.r*0.22,0,7);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();
}

function draw(){
  drawBackground();
  const HUD_Y=Math.min(H*0.17,132);
  ctx.save();ctx.shadowColor='rgba(90,0,40,.55)';ctx.shadowBlur=7;
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='800 20px -apple-system,Roboto,sans-serif';
  ctx.fillText('Điểm '+score,20,HUD_Y);
  ctx.textAlign='right';
  ctx.fillText(Math.max(0,Math.ceil((hidden?DUR:BASE_TIME)-time))+'s',W-20,HUD_Y);
  if(combo>=2){
    const k=Math.min(1,combo/12);
    ctx.textAlign='center';
    ctx.font='900 '+Math.round(17+k*7)+'px -apple-system,Roboto,sans-serif';
    ctx.fillStyle='#FFE9A8';
    ctx.fillText('×'+combo+' COMBO',W/2,HUD_Y);
  }
  ctx.restore();
  if(true){
    const left=Math.max(0,MISS_ALLOWED-misses);
    ctx.save();ctx.textAlign='left';ctx.font='800 15px -apple-system,Roboto,sans-serif';
    ctx.globalAlpha=.9;ctx.fillStyle=left>0?'#FFE9A8':'rgba(255,255,255,.55)';
    ctx.fillText(hidden?'✨ +5/quả':'❤ '+left+' lượt rơi',20,HUD_Y+26);
    ctx.restore();
  }
  if(bannerT>0){
    const a=Math.min(1,bannerT/0.5)*Math.min(1,(2.8-bannerT)/0.35);
    ctx.save();ctx.globalAlpha=Math.max(0,a);
    ctx.textAlign='center';
    ctx.font='900 30px -apple-system,Roboto,sans-serif';
    ctx.shadowColor='rgba(90,0,40,.7)';ctx.shadowBlur=14;
    ctx.fillStyle='#FFE9A8';
    ctx.fillText('✨ MÀN ẨN MỞ KHÓA ✨',W/2,H*0.30);
    ctx.font='800 20px -apple-system,Roboto,sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('30 giây · mỗi món +5 điểm',W/2,H*0.30+34);
    ctx.restore();
  }
  pearls.filter(function(q){return !q.caught;}).forEach(drawPearl);
  drawCup();
  drawBursts();
}

let last=0;

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

function buildPoster(){
  const p=document.getElementById('posterCv');
  p.width=720;p.height=1000;
  const g=p.getContext('2d');
  if(bgImg.complete&&bgImg.naturalWidth){
    g.drawImage(bgImg,0,90,720,1000);
  }
  const glass=g.createLinearGradient(0,0,0,1000);
  glass.addColorStop(0,'rgba(222,12,116,.86)');
  glass.addColorStop(.45,'rgba(190,8,96,.93)');
  glass.addColorStop(1,'rgba(120,4,54,.97)');
  g.fillStyle=glass;g.fillRect(0,0,720,1000);
  g.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<26;i++){g.beginPath();g.arc((i*149)%720,(i*223)%1000,2+(i%3),0,7);g.fill();}

  g.textAlign='center';g.fillStyle='#fff';
  g.font='italic bold 90px Georgia,serif';
  g.fillText('PopSip',360,150);
  g.font='800 36px -apple-system,Roboto,sans-serif';
  g.fillText('BẮT TRÂN CHÂU',360,210);
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;
  g.beginPath();g.moveTo(160,250);g.lineTo(560,250);g.stroke();

  g.font='600 23px -apple-system,Roboto,sans-serif';
  g.globalAlpha=.85;g.fillText('NGƯỜI CHƠI',360,304);g.globalAlpha=1;
  g.font='800 42px -apple-system,Roboto,sans-serif';
  g.fillText(playerName,360,354);

  g.font='900 156px -apple-system,Roboto,sans-serif';
  g.fillText(String(score),360,512);
  g.font='700 26px -apple-system,Roboto,sans-serif';
  g.globalAlpha=.85;g.fillText('ĐIỂM',360,552);g.globalAlpha=1;
  g.font='600 24px -apple-system,Roboto,sans-serif';
  g.fillStyle='#FFE9A8';
  g.font='900 30px -apple-system,Roboto,sans-serif';
  g.fillText('COMBO ×'+maxCombo,360,600);
  g.fillStyle='#fff';
  g.font='700 20px -apple-system,Roboto,sans-serif';
  g.fillText(hidden?'MÀN ẨN':'60 giây',360,626);

  if(qrImg.complete&&qrImg.naturalWidth){
    const qs=164,pad=13,w=qs+pad*2,bx=360-w/2,by=652;
    g.fillStyle='#fff';roundRect(g,bx,by,w,w,16);g.fill();
    g.drawImage(qrImg,bx+pad,by+pad,qs,qs);
    g.fillStyle='#fff';g.font='700 21px -apple-system,Roboto,sans-serif';
    g.fillText('QUÉT MÃ · CHƠI NGAY',360,by+w+28);
  }
  g.font='700 21px -apple-system,Roboto,sans-serif';
  g.fillStyle='#FFE9A8';
  g.font='600 18px -apple-system,Roboto,sans-serif';
  g.fillStyle='#fff';g.globalAlpha=.8;
  if(hidden){
    g.fillStyle='#FFE9A8';g.font='800 22px -apple-system,Roboto,sans-serif';
    g.fillText('🏆 MÀN ẨN + 1 LY · TẶNG 1 XÚC XÍCH',360,928);
  }else{
    g.fillText('Game mới mỗi tuần · Nhóm Zalo nhận quà',360,928);
  }
  g.globalAlpha=.75;
  g.fillText('Tham gia nhóm Zalo để nhận quà',360,958);
  g.globalAlpha=1;

  p.toBlob(function(b){posterBlob=b;},'image/png');
  document.getElementById('poster').src=p.toDataURL('image/png');
}

function saveImage(){
  const img=document.getElementById('poster');
  const a=document.createElement('a');
  a.href=img.src;a.download='popsip-'+score+'.png';
  document.body.appendChild(a);a.click();a.remove();
}

function toast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.remove('hide');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.add('hide');},3400);
}

async function shareResult(){
  const ref=SITE+'?ch='+score+'&n='+encodeURIComponent(playerName);
  const text='Tôi được '+score+' điểm trong PopSip · Bắt Trân Châu! Bạn có vượt được không?';

  // 1) 系统分享面板（Safari/Chrome：一步发出）
  try{
    if(posterBlob&&navigator.canShare&&navigator.canShare({files:[new File([posterBlob],'popsip.png',{type:'image/png'})]})){
      await navigator.share({files:[new File([posterBlob],'popsip-'+score+'.png',{type:'image/png'})],text:text+' '+ref});
      return;
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }

  // 2) 内置浏览器：把图片直接复制到剪贴板，粘贴即可发送
  try{
    if(posterBlob&&navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'image/png':Promise.resolve(posterBlob)})]);
      toast('Đã sao chép ảnh<br>Giữ ô nhập tin → Dán → Gửi');
      return;
    }
  }catch(e){}

  // 3) 最后兜底：弹转发卡，长按保存

/* ===== 音效引擎（Web Audio 合成，无需素材文件） ===== */
const sockImg=new Image();
sockImg.src='./sock.png';
let AC=null, soundOn=true;
const MASTER=2.4;   // 总音量倍数
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,delay){
  if(!AC||!soundOn) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  const peak=Math.min(0.95,(vol||0.12)*MASTER);
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.15));
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+(dur||0.15)+0.02);
}

function waterSplash(px,py){
  if(typeof confetti!=='function') return false;
  confetti({
    particleCount: 7, spread: 58, startVelocity: 13, gravity: 1.15, ticks: 34,
    scalar: 0.72, shapes: ['circle'], zIndex: 5,
    colors: ['#FFFFFF','#EAF8FF','#C9ECFF','#A8E0FF'],
    origin: { x: Math.max(0.03,Math.min(0.97,px/W)), y: Math.max(0.05,Math.min(0.95,py/H)) },
    disableForReducedMotion: true
  });
  return true;
}

const XMAS_NOTE={C:261.63,D:293.66,E:329.63,F:349.23,G:392.0,A:440.0,C5:523.25};
// 完整 Jingle Bells 副歌（音名, 拍数）
const XMAS=[
 ['E',1],['E',1],['E',2],
 ['E',1],['E',1],['E',2],
 ['E',1],['G',1],['C',1.5],['D',0.5],['E',4],
 ['F',1],['F',1],['F',1.5],['F',0.5],
 ['F',1],['E',1],['E',1],['E',0.5],['E',0.5],
 ['E',1],['D',1],['D',1],['E',1],
 ['D',2],['G',2],
 ['E',1],['E',1],['E',2],
 ['E',1],['E',1],['E',2],
 ['E',1],['G',1],['C',1.5],['D',0.5],['E',4],
 ['F',1],['F',1],['F',1.5],['F',0.5],
 ['F',1],['E',1],['E',1],['E',0.5],['E',0.5],
 ['G',1],['G',1],['F',1],['D',1],
 ['C',4]
];
const XMAS_BEAT=0.235;
let xmasOn=false, xmasTimer=null;
function xmasCycle(){
  if(!xmasOn||!AC) return;
  let t=0;
  for(const [n,b] of XMAS){
    tone(XMAS_NOTE[n], Math.max(0.09,b*XMAS_BEAT*0.92), 'triangle', 0.085, t);
    t += b*XMAS_BEAT;
  }
  xmasTimer=setTimeout(xmasCycle, t*1000+40);
}
function startXmas(){
  if(xmasOn||!AC) return;
  xmasOn=true; xmasCycle();
}
function stopXmas(){
  xmasOn=false;
  if(xmasTimer){ clearTimeout(xmasTimer); xmasTimer=null; }
}
function sfxJingle(){ startXmas(); }

function sfxFanfare(){
  const n=[[523,0.12],[659,0.12],[784,0.12],[1047,0.30],[784,0.12],[1047,0.42]];
  let t=0; n.forEach(function(x){ tone(x[0],x[1],'triangle',0.16,t); t+=x[1]+0.03; });
}

<script>
/* ===== PopSip 排行榜：主按钮 = 提交+看榜（最重要） ===== */
(function(){
  const API_BASE = 'https://popsip-rank.hw2948911.workers.dev';
  if(!API_BASE) return;

  function el(tag, cls, txt){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(txt!=null) e.textContent=txt;
    return e;
  }

  const acts=document.querySelector('#over .acts');
  if(!acts) return;

  // 次级按钮缩小
  const st=el('style');
  st.textContent='#over .acts{max-width:330px}#over .acts .btn{padding:11px 8px;font-size:14px;opacity:.92}'+
                 '#over .rankmain{margin-top:4px}';
  document.head.appendChild(st);

  // 主按钮：提交 + 弹榜
  const main=el('button','btn rankmain','🏆 Gửi điểm & Xếp hạng');
  main.style.width='100%'; main.style.maxWidth='330px';
  main.style.padding='20px 12px'; main.style.fontSize='20px'; main.style.fontWeight='900';
  main.style.boxShadow='0 12px 30px rgba(60,0,30,.5)';
  main.style.background='linear-gradient(180deg,#FFF3C4,#FFD34D)';
  main.style.color='#B0005A';
  main.style.border='2px solid rgba(255,255,255,.7)';
  acts.parentNode.insertBefore(main, acts);

  function openBoard(d){
    const top=(d&&d.top)?d.top:[];
    let html='<div class="mtitle">🏆 BẢNG XẾP HẠNG HÔM NAY</div><ol class="msteps">';
    if(top.length){
      top.slice(0,3).forEach(function(t,i){
        const med=['🥇','🥈','🥉'][i]||(i+1);
        html+='<li>'+med+' '+t.name+' — <b>'+t.score+'</b> điểm</li>';
      });
    }else{
      html+='<li>Hôm nay chưa có ai ghi điểm</li>';
    }
    html+='</ol>';
    // 自己固定在最下面一条
    if(d && d.me){
      html+='<div class="myrow">Bạn · #'+d.me.rank+' — <b>'+d.me.score+'</b> điểm · combo '+d.me.combo+'</div>';
    }else{
      html+='<div class="myrow">Bạn chưa có điểm hôm nay</div>';
    }

    const box=el('div','modal'); const inner=el('div','mbox');
    inner.innerHTML=html;
    const close=el('button','btn','Đóng');
    close.onclick=function(){ document.body.removeChild(box); };
    inner.appendChild(close); box.appendChild(inner);
    box.onclick=function(e){ if(e.target===box) document.body.removeChild(box); };
    document.body.appendChild(box);
  }

  main.onclick=async function(){
    if(main.disabled) return;
    main.disabled=true; main.textContent='⏳ Đang gửi…';
    const name=(typeof playerName==='string'&&playerName)?playerName:'Người chơi';
    try{
      await fetch(API_BASE+'/submit',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          name:name,
          score:(typeof score==='number'?score:0),
          combo:(typeof maxCombo==='number'?maxCombo:0),
          hidden:(typeof hidden==='boolean'?hidden:false),
          dev:(navigator.userAgent||'').slice(0,24)
        })
      });
    }catch(e){}
    let d=null;
    try{
      const r=await fetch(API_BASE+'/board?name='+encodeURIComponent(name));
      d=await r.json();
    }catch(e){}
    openBoard(d);
    main.disabled=false; main.textContent='🏆 Gửi điểm & Xếp hạng';
  };
})();
</script>
