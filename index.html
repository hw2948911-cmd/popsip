<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#E0006B;
font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#game{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:14px;color:#fff;text-align:center;padding:26px;
background:
 radial-gradient(120% 80% at 20% 8%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%),
 linear-gradient(180deg,#E8117C 0%,#C40A5C 55%,#8E0640 100%);}
.hide{display:none!important}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.75)}
.acts .btn{min-width:132px}
.btn.zalo{background:#0068FF;color:#fff}
.challenge{max-width:320px;margin-top:6px;padding:10px 16px;border-radius:14px;
  background:rgba(255,255,255,.16);border:2px solid rgba(255,233,168,.85);
  font-size:14px;font-weight:700;color:#FFE9A8;line-height:1.5}
.invite{font-size:12px;font-weight:600;color:#fff;opacity:.8}
.promo{margin-top:4px;font-size:14px;font-weight:700;color:#FFE9A8;line-height:1.65;letter-spacing:.3px}

font-weight:700;letter-spacing:-2px}
h1{font-size:40px;margin:0;font-weight:800}
.btn{background:#fff;color:#D60066;border:0;border-radius:999px;
padding:14px 36px;font-size:18px;font-weight:800}
input{border:0;border-radius:999px;padding:12px 18px;font-size:16px;
text-align:center;width:220px;outline:0}
small{opacity:.85;font-size:13px;line-height:1.7}
#poster{width:80vw;max-width:330px;border-radius:16px;
box-shadow:0 10px 34px rgba(0,0,0,.4)}

/* ── 圣诞装饰 ── */
.panel{z-index:2}
.snow{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.flake{position:absolute;top:-26px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.55);
animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(112vh) rotate(360deg)}}
.xmas{position:fixed;left:0;right:0;top:0;height:auto;pointer-events:none;z-index:3;line-height:0}
.xmas svg{display:block;width:100%;height:auto}
.xmas .twinkle{animation:tw 2.4s ease-in-out infinite}
.xmas .twinkle:nth-child(2n){animation-delay:.8s}
.xmas .twinkle:nth-child(3n){animation-delay:1.5s}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.flake{animation:none;opacity:.35}.xmas .twinkle{animation:none}}
</style>

<div id="start" class="panel">
  <div class="logo" style="font-size:56px">PopSip</div>
  <h1>Bắt Trân Châu</h1>

  <div class="challenge hide" id="challenge"></div>
  <div class="promo">Thi đấu mỗi ngày · Điểm cao có quà<br>Game mới mỗi tuần</div>
  <div class="invite hide" id="invite"></div>
  <small style="max-width:300px">60 giây mỗi ván · hứng ở 1/3 miệng cốc<br>
  đen +1 · trắng +2 · bánh flan +5 · rơi mất −2</small>
</div>

  <canvas id="posterCv" style="display:none"></canvas>
  <img id="poster" alt="score">
  <div class="acts">
    <button class="btn" id="share">Chia sẻ</button>
    <button class="btn ghost" id="save">Lưu ảnh</button>
  </div>
  <button class="btn zalo" id="zalo">Vào nhóm Zalo nhận quà</button>
  <button class="btn ghost" id="again">Chơi lại</button>
  <small id="hint">Thi đấu mỗi ngày · Điểm cao có quà · Game mới mỗi tuần</small>
</div>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const PINK='#E0006B',RED='#D62828',DUR=60;
const ZALO_URL='';  // 官方 Zalo 群链接，填了才会显示按钮
const SITE='https://hw2948911-cmd.github.io/popsip/';
const QS=new URLSearchParams(location.search);
const CH_SCORE=parseInt(QS.get('ch')||'',10);      // 好友挑战分数
const CH_NAME=(QS.get('n')||'').slice(0,12);       // 好友名字
const REF=(QS.get('r')||'').slice(0,12);           // 邀请人
let W=0,H=0,cupX=0,cupY=0;
const cupW=84,cupH=104;

let state='start',score=0,level=1,pearls=[],spawnT=0,shake=0,playerName='',time=0;

function resize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth||window.innerWidth;
  H=cv.clientHeight||window.innerHeight;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  cupY=H-cupH-52;
  if(!cupX)cupX=W/2;
}

function reset(){
  score=0;level=1;pearls=[];spawnT=0;shake=0;time=0;
  cupX=W/2;cupY=H-cupH-52;
}

function spawnPearl(){
  const gapY=Math.max(70,150-Math.max(0,time-30)*2.2);
  const top=pearls.reduce((m,p)=>Math.min(m,p.y),9999);
  if(top<gapY)return false;
  const r=Math.random();
  let kind='pearl',pts=1,rad=11;
  if(r>0.96){kind='pudding';pts=5;rad=14;}
  else if(r>0.84){kind='white';pts=2;rad=11;}
  const rush=Math.min(2.2,1+Math.max(0,time-15)*0.02);
  let px=26+Math.random()*(W-52);
  for(let k=0;k<8;k++){
    const clash=pearls.some(p=>p.y<190&&Math.abs(p.x-px)<100);
    if(!clash)break;
    px=26+Math.random()*(W-52);
  }
  pearls.push({x:px,y:-24,r:rad,kind:kind,pts:pts,
    v:(95+level*14+Math.random()*40)*rush});
  return true;
}

function update(dt){
  if(state!=='play')return;
  time+=dt;
  if(time>=DUR){gameOver();return;}
  level=Math.min(12,1+Math.floor(score/10));
  const gap=Math.max(0.18,1.35-level*0.05-Math.max(0,time-10)*0.012);
  spawnT-=dt;
  if(spawnT<=0){
    if(spawnPearl()){
      spawnT=gap;
      if(time>45&&Math.random()<0.35)spawnPearl();
    }else{
      spawnT=0.08;
    }
  }
  for(let i=pearls.length-1;i>=0;i--){
    const p=pearls[i];
    p.y+=p.v*dt;
    const inZone=p.y+p.r>cupY&&p.y-p.r<cupY+cupH/3;
    if(inZone&&Math.abs(p.x-cupX)<cupW*0.5+p.r*0.4){
      pearls.splice(i,1);score+=p.pts;shake=9;continue;
    }
    if(p.y-p.r>H){
      pearls.splice(i,1);score=Math.max(0,score-2);shake=5;
    }
  }
  if(shake>0)shake=Math.max(0,shake-dt*45);
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#EA2A78');
  g.addColorStop(.55,'#CE0A5E');
  g.addColorStop(1,'#8E0B3C');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const tt=performance.now()/1000;
  for(let i=0;i<50;i++){
    const sp=10+(i%5)*7;
    const x=(i*137)%(W||1);
    const y=((i*79+tt*sp)%(H+60))-30;
    const r=1.4+(i%3)*1.1;
    ctx.globalAlpha=.55+(i%4)*0.12;
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawCup(){
  ctx.save();
  ctx.translate(cupX+(Math.random()-0.5)*shake,cupY);
  const t=cupW/2,b=cupW*0.36;
  const p=()=>{ctx.beginPath();ctx.moveTo(-t,0);ctx.lineTo(-b,cupH);
    ctx.quadraticCurveTo(0,cupH+12,b,cupH);ctx.lineTo(t,0);ctx.closePath();};
  p();ctx.fillStyle='#FFFDF9';ctx.fill();
  p();ctx.strokeStyle=PINK;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,t,6,0,0,7);
  ctx.fillStyle='#FFFDF9';ctx.fill();ctx.stroke();
  ctx.fillStyle=PINK;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='italic bold 19px Georgia,serif';
  ctx.fillText('PopSip',0,cupH*0.47);
  ctx.restore();
}

function drawPearl(p){
  if(p.kind==='pudding'){
    const w=p.r*1.8,h=p.r*1.6;
    ctx.beginPath();
    ctx.moveTo(p.x-w/2,p.y-h/2);
    ctx.lineTo(p.x+w/2,p.y-h/2);
    ctx.lineTo(p.x+w*0.38,p.y+h/2);
    ctx.quadraticCurveTo(p.x,p.y+h/2+7,p.x-w*0.38,p.y+h/2);
    ctx.closePath();
    const g2=ctx.createLinearGradient(0,p.y-h/2,0,p.y+h/2);
    g2.addColorStop(0,'#FFE7A8');g2.addColorStop(1,'#EFB43F');
    ctx.fillStyle=g2;ctx.fill();
    ctx.beginPath();ctx.ellipse(p.x,p.y-h/2,w/2,w*0.16,0,0,7);
    ctx.fillStyle='#A9581B';ctx.fill();
    return;
  }
  const g=ctx.createRadialGradient(p.x-3,p.y-4,1,p.x,p.y,p.r);
  if(p.kind==='white'){
    g.addColorStop(0,'rgba(255,255,255,.98)');
    g.addColorStop(1,'rgba(230,242,255,.8)');
  }else{
    g.addColorStop(0,'#6B4226');g.addColorStop(1,'#2A1608');
  }
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(p.x-p.r*0.32,p.y-p.r*0.35,p.r*0.22,0,7);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();
}

function draw(){
  drawBackground();
  const HUD_Y=Math.min(H*0.17,132);
  ctx.save();ctx.shadowColor='rgba(90,0,40,.55)';ctx.shadowBlur=7;
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='800 20px -apple-system,Roboto,sans-serif';
  ctx.fillText('Điểm '+score,20,HUD_Y);
  ctx.textAlign='right';
  ctx.fillText(Math.max(0,Math.ceil(DUR-time))+'s',W-20,HUD_Y);
  ctx.textAlign='center';ctx.font='600 14px -apple-system,Roboto,sans-serif';
  ctx.globalAlpha=.85;ctx.fillText('Cấp '+level,W/2,HUD_Y);ctx.globalAlpha=1;ctx.restore();
  pearls.forEach(drawPearl);
  drawCup();
}

let last=0;
function loop(ts){
  const dt=Math.min(0.034,(ts-last)/1000||0);last=ts;
  update(dt);draw();requestAnimationFrame(loop);
}

const SHARE_URL='https://hw2948911-cmd.github.io/popsip/';

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

function buildPoster(){
  const p=document.getElementById('posterCv');
  p.width=720;p.height=1000;
  const g=p.getContext('2d');
  if(bgImg.complete&&bgImg.naturalWidth){
    g.drawImage(bgImg,0,90,720,1000);
  }
  const glass=g.createLinearGradient(0,0,0,1000);
  glass.addColorStop(0,'rgba(222,12,116,.86)');
  glass.addColorStop(.45,'rgba(190,8,96,.93)');
  glass.addColorStop(1,'rgba(120,4,54,.97)');
  g.fillStyle=glass;g.fillRect(0,0,720,1000);
  g.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<26;i++){g.beginPath();g.arc((i*149)%720,(i*223)%1000,2+(i%3),0,7);g.fill();}

  g.textAlign='center';g.fillStyle='#fff';
  g.font='italic bold 90px Georgia,serif';
  g.fillText('PopSip',360,150);
  g.font='800 36px -apple-system,Roboto,sans-serif';
  g.fillText('BẮT TRÂN CHÂU',360,210);
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;
  g.beginPath();g.moveTo(160,250);g.lineTo(560,250);g.stroke();

  g.font='600 23px -apple-system,Roboto,sans-serif';
  g.globalAlpha=.85;g.fillText('NGƯỜI CHƠI',360,304);g.globalAlpha=1;
  g.font='800 42px -apple-system,Roboto,sans-serif';
  g.fillText(playerName,360,354);

  g.font='900 156px -apple-system,Roboto,sans-serif';
  g.fillText(String(score),360,512);
  g.font='700 26px -apple-system,Roboto,sans-serif';
  g.globalAlpha=.85;g.fillText('ĐIỂM',360,552);g.globalAlpha=1;
  g.font='600 24px -apple-system,Roboto,sans-serif';
  g.fillText('60 giây · Cấp '+level,360,598);

  if(qrImg.complete&&qrImg.naturalWidth){
    const qs=176,pad=13,w=qs+pad*2,bx=360-w/2,by=628;
    g.fillStyle='#fff';roundRect(g,bx,by,w,w,16);g.fill();
    g.drawImage(qrImg,bx+pad,by+pad,qs,qs);
    g.fillStyle='#fff';g.font='700 21px -apple-system,Roboto,sans-serif';
    g.fillText('QUÉT MÃ · CHƠI NGAY',360,by+w+28);
  }
  g.font='700 21px -apple-system,Roboto,sans-serif';
  g.fillStyle='#FFE9A8';
  g.fillText('Thi đấu mỗi ngày · Điểm cao có quà',360,896);
  g.font='600 18px -apple-system,Roboto,sans-serif';
  g.fillStyle='#fff';g.globalAlpha=.8;
  g.fillText('Game mới mỗi tuần · Nhóm Zalo nhận quà',360,928);
  g.globalAlpha=.75;
  g.fillText('PopSip · 280 Lạc Long Quân, Q.11',360,958);
  g.globalAlpha=1;

  p.toBlob(function(b){posterBlob=b;},'image/png');
  document.getElementById('poster').src=p.toDataURL('image/png');
}

function saveImage(){
  const img=document.getElementById('poster');
  const a=document.createElement('a');
  a.href=img.src;a.download='popsip-'+score+'.png';
  document.body.appendChild(a);a.click();a.remove();
}

async function shareResult(){
  const ref=SITE+'?ch='+score+'&n='+encodeURIComponent(playerName);
  const text='Tôi được '+score+' điểm trong PopSip · Bắt Trân Châu! Bạn có vượt được không?';
  try{
    if(posterBlob&&navigator.canShare&&navigator.canShare({files:[new File([posterBlob],'popsip.png',{type:'image/png'})]})){
      await navigator.share({files:[new File([posterBlob],'popsip-'+score+'.png',{type:'image/png'})],text:text+' '+ref});
      return;
    }
    if(navigator.share){await navigator.share({text:text,url:ref});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  saveImage();
}

function gameOver(){
  state='over';
  buildPoster();
  const hintEl=document.getElementById('hint');
  if(hintEl&&Number.isFinite(CH_SCORE)&&CH_SCORE>0){
    hintEl.textContent = score>CH_SCORE
      ? 'Bạn đã vượt '+(CH_NAME||'đối thủ')+'! Gửi ảnh vào nhóm để khiêu chiến tiếp'
      : 'Còn thiếu '+(CH_SCORE-score+1)+' điểm để vượt '+(CH_NAME||'đối thủ')+' — chơi lại!';
    hintEl.style.fontWeight='700';
  }
  document.getElementById('over').classList.remove('hide');
}

let dragging=false;
function moveTo(x){cupX=Math.max(cupW/2+6,Math.min(W-cupW/2-6,x));}
cv.addEventListener('pointerdown',e=>{dragging=true;moveTo(e.clientX);});
cv.addEventListener('pointermove',e=>{if(dragging)moveTo(e.clientX);});
cv.addEventListener('pointerup',()=>dragging=false);
cv.addEventListener('pointercancel',()=>dragging=false);
window.addEventListener('keydown',e=>{
  if(state!=='play')return;
  if(e.key==='ArrowLeft')moveTo(cupX-26);
  if(e.key==='ArrowRight')moveTo(cupX+26);
});

// ── 裂变：挑战 / 邀请 ──
(function(){
  const ch=document.getElementById('challenge');
  if(ch&&Number.isFinite(CH_SCORE)&&CH_SCORE>0){
    ch.classList.remove('hide');
    ch.innerHTML='🔥 <b>'+(CH_NAME||'Bạn của bạn')+'</b> đang giữ <b>'+CH_SCORE+' điểm</b><br>Bạn có vượt được không?';
  }
  const inv=document.getElementById('invite');
  try{
    let n=parseInt(localStorage.getItem('popsip_invite')||'0',10)||0;
    if(REF&&!localStorage.getItem('popsip_ref_'+REF)){ n++; localStorage.setItem('popsip_invite',String(n)); localStorage.setItem('popsip_ref_'+REF,'1'); }
    if(n>0&&inv){ inv.classList.remove('hide'); inv.textContent='Bạn đã mời '+n+' người chơi'; }
  }catch(e){}
})();
document.getElementById('play').onclick=()=>{
  playerName=(document.getElementById('name').value||'').trim().slice(0,12)||'Người chơi';
  document.getElementById('start').classList.add('hide');
  resize();reset();state='play';
};
document.getElementById('share').onclick=shareResult;
document.getElementById('save').onclick=saveImage;
document.getElementById('zalo').onclick=function(){ if(ZALO_URL){ location.href=ZALO_URL; } };
if(!ZALO_URL){ document.getElementById('zalo').style.display='none'; }
document.getElementById('again').onclick=function(){
  document.getElementById('over').classList.add('hide');
  reset();state='play';
};

window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);

// 飘雪：随机大小/速度/透明度，纯装饰
(function(){
  const box=document.getElementById('snow');
  if(!box)return;
  for(let i=0;i<24;i++){
    const s=document.createElement('span');
    s.className='flake';
    s.textContent=i%3===0?'❄':'✻';
    s.style.left=(Math.random()*100).toFixed(1)+'vw';
    s.style.fontSize=(7+Math.random()*13).toFixed(1)+'px';
    s.style.opacity=(.22+Math.random()*.4).toFixed(2);
    s.style.animationDuration=(7+Math.random()*11).toFixed(1)+'s';
    s.style.animationDelay=(-Math.random()*14).toFixed(1)+'s';
    box.appendChild(s);
  }
})();
</script>
